[project]
name = "qwenpaw-skillscanner"
version = "0.1.0"
description = "Standalone static security scanner for agent skill packages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
skillscanner = "skillscanner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillscanner"]

[tool.hatch.build.targets.sdist]
include = [
    "src/skillscanner",
    "README.md",
    "pyproject.toml",
]
